<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Дневник хоккеиста</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a1420; --bg-panel:#0f1e2e; --bg-panel-2:#152a3f; --bg-panel-3:#1b3450;
    --ice:#e7f4fc; --muted:#7f97b0; --muted-2:#5a7189;
    --cyan:#4fd8ff; --red:#ee3b52; --gold:#ffb648;
    --line: rgba(231,244,252,0.09); --line-strong: rgba(231,244,252,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(79,216,255,0.08), transparent 60%), var(--bg);
    color:var(--ice); font-family:'Inter',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .app{max-width:980px;margin:0 auto;padding:28px 18px 80px;}
  .rink{position:relative;border:1.5px solid var(--line-strong);border-radius:22px;padding:26px 24px;margin-bottom:22px;overflow:hidden;background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));}
  .rink::before{content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 84% 50%, transparent 39px, rgba(79,216,255,0.14) 40px, rgba(79,216,255,0.14) 41px, transparent 42px),
    linear-gradient(90deg, transparent 78%, rgba(238,59,82,0.5) 78%, rgba(238,59,82,0.5) 78.6%, transparent 78.6%);
    pointer-events:none;opacity:.55;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin:0 0 6px;}
  h1{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(28px,5vw,40px);margin:0 0 4px;position:relative;}
  .subtitle{color:var(--muted);font-size:14.5px;margin:0;position:relative;max-width:560px;line-height:1.5;}
  .scoreboard{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-strong);border:1px solid var(--line-strong);border-radius:14px;overflow:hidden;margin-top:20px;position:relative;}
  .score-cell{background:#08131f;padding:14px 10px;text-align:center;}
  .score-num{font-family:'Oswald',sans-serif;font-weight:700;font-size:28px;color:var(--ice);font-variant-numeric:tabular-nums;line-height:1;}
  .score-num.cyan{color:var(--cyan);} .score-num.gold{color:var(--gold);} .score-num.red{color:var(--red);}
  .score-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);margin-top:5px;}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .tab-btn{font-family:'JetBrains Mono',monospace;font-size:12px;background:none;border:none;color:var(--muted);padding:10px 14px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;}
  .tab-btn:hover{color:var(--ice);}
  .tab-btn.active{color:var(--cyan);border-bottom-color:var(--cyan);}
  .tab-btn.soon{opacity:.4;cursor:default;}
  .panel{display:none;} .panel.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .card{background:var(--bg-panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;}
  .card h2{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:16px;margin:0 0 14px;color:var(--ice);display:flex;align-items:center;gap:8px;}
  .card h2 .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);display:inline-block;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media(max-width:640px){.grid3,.grid4{grid-template-columns:1fr 1fr;}}
  label{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;color:var(--muted-2);margin-bottom:5px;}
  input,select,textarea{width:100%;background:#081120;border:1px solid var(--line-strong);border-radius:9px;color:var(--ice);font-family:'Inter',sans-serif;font-size:14px;padding:9px 11px;outline:none;transition:border-color .15s;}
  input:focus,select:focus,textarea:focus{border-color:var(--cyan);}
  input[type=range]{padding:0;accent-color:var(--cyan);}
  textarea{resize:vertical;min-height:60px;}
  .field{margin-bottom:12px;}
  .range-val{font-family:'JetBrains Mono',monospace;color:var(--cyan);font-size:13px;float:right;}
  .btn{font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;background:var(--cyan);color:#04141f;border:none;border-radius:9px;padding:11px 18px;cursor:pointer;font-weight:700;}
  .btn:hover{filter:brightness(1.08);}
  .row-end{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;}
  .routine-item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);}
  .routine-item:last-child{border-bottom:none;}
  .routine-time{font-family:'JetBrains Mono',monospace;color:var(--cyan);font-size:12.5px;width:48px;flex-shrink:0;}
  .routine-title{flex:1;font-size:14px;}
  .routine-title.done{color:var(--muted-2);text-decoration:line-through;}
  .check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-strong);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;background:#081120;}
  .check.checked{background:var(--cyan);border-color:var(--cyan);color:#04141f;}
  .soon-card{border:1px dashed var(--line-strong);border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted-2);font-family:'JetBrains Mono',monospace;font-size:13px;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-panel-3);border:1px solid var(--line-strong);color:var(--ice);padding:11px 20px;border-radius:10px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;z-index:50;font-family:'JetBrains Mono',monospace;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .day-picker{display:flex;gap:8px;align-items:center;margin-bottom:16px;}
  .day-picker input{max-width:180px;}
  .settings-inline{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
  .settings-inline .field{margin-bottom:0;min-width:160px;}
</style>
</head>
<body>
<div class="app">
  <div class="rink">
    <p class="eyebrow">// личный дневник · сезон 2026/2027</p>
    <h1>Дневник хоккеиста</h1>
    <p class="subtitle">Дашборд дня и режим — этап 1. Питание, тело, тренировки и игры добавим следующими.</p>
    <div class="scoreboard">
      <div class="score-cell"><div class="score-num cyan" id="sb-streak">–</div><div class="score-label">Дней подряд</div></div>
      <div class="score-cell"><div class="score-num gold" id="sb-countdown">–</div><div class="score-label">До сезона</div></div>
      <div class="score-cell"><div class="score-num" id="sb-readiness">–</div><div class="score-label">Готовность</div></div>
      <div class="score-cell"><div class="score-num red" id="sb-weight">–</div><div class="score-label">Вес, кг</div></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="today">Сегодня</button>
    <button class="tab-btn" data-tab="settings">Настройки</button>
    <button class="tab-btn soon">Питание (скоро)</button>
    <button class="tab-btn soon">Тело (скоро)</button>
    <button class="tab-btn soon">Игры (скоро)</button>
  </div>

  <div class="panel active" id="panel-today">
    <div class="day-picker"><label style="margin:0">Дата</label><input type="date" id="today-date"/></div>

    <div class="card">
      <h2><span class="dot"></span>Дашборд дня</h2>
      <div class="grid4">
        <div class="field"><label>Вес, кг</label><input type="number" step="0.1" id="f-weight" placeholder="72.0"/></div>
        <div class="field"><label>Сон, часов</label><input type="number" step="0.25" id="f-sleep" placeholder="8"/></div>
        <div class="field"><label>Пульс утром</label><input type="number" id="f-pulse" placeholder="52"/></div>
        <div class="field"><label>Настроение</label>
          <select id="f-mood"><option value="😊">😊 отлично</option><option value="😐" selected>😐 нормально</option><option value="😞">😞 тяжело</option></select>
        </div>
      </div>
      <div class="grid3">
        <div class="field"><label>Энергия <span class="range-val" id="v-energy">5</span></label><input type="range" min="1" max="10" value="5" id="f-energy"/></div>
        <div class="field"><label>Мотивация <span class="range-val" id="v-motivation">5</span></label><input type="range" min="1" max="10" value="5" id="f-motivation"/></div>
        <div class="field"><label>Усталость <span class="range-val" id="v-fatigue">5</span></label><input type="range" min="1" max="10" value="5" id="f-fatigue"/></div>
      </div>
      <div class="grid4">
        <div class="field"><label>Вода, л</label><input type="number" step="0.1" id="f-water" placeholder="2.5"/></div>
        <div class="field"><label>Калории</label><input type="number" id="f-calories" placeholder="3200"/></div>
        <div class="field"><label>Белок, г</label><input type="number" id="f-protein" placeholder="140"/></div>
        <div class="field"><label>Задачи выполнены, %</label><input type="number" min="0" max="100" id="f-tasks" placeholder="80"/></div>
      </div>
      <div class="field"><label>Заметка дня</label><textarea id="f-note" placeholder="как прошёл день..."></textarea></div>
      <div class="row-end"><button class="btn" id="save-day">Сохранить день</button></div>
    </div>

    <div class="card">
      <h2><span class="dot"></span>Режим дня</h2>
      <div id="routine-list"></div>
    </div>
  </div>

  <div class="panel" id="panel-settings">
    <div class="card">
      <h2><span class="dot"></span>Настройки</h2>
      <div class="settings-inline">
        <div class="field"><label>Целевой вес, кг</label><input type="number" step="0.1" id="s-target-weight"/></div>
        <div class="field"><label>Дата старта сезона (регулярка)</label><input type="date" id="s-season-start"/></div>
        <button class="btn" id="save-settings">Сохранить</button>
      </div>
    </div>
    <div class="card">
      <h2><span class="dot"></span>Шаблон режима дня</h2>
      <p style="color:var(--muted);font-size:13px;margin-top:-6px;">Отредактируйте время/пункты — применится ко всем дням.</p>
      <div id="routine-editor"></div>
      <div class="row-end">
        <button class="btn" style="background:var(--bg-panel-3);color:var(--ice);border:1px solid var(--line-strong);" id="add-routine-item">+ пункт</button>
        <button class="btn" id="save-routine">Сохранить шаблон</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api/hockey';
const toastEl = document.getElementById('toast');
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'),1800); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

async function api(method, url, body){
  const opts = { method, headers:{} };
  if(body !== undefined){ opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body); }
  const res = await fetch(API+url, opts);
  if(!res.ok) throw new Error('Ошибка запроса: '+res.status);
  return res.json();
}

document.querySelectorAll('.tab-btn:not(.soon)').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  });
});

['energy','motivation','fatigue'].forEach(id=>{
  const input = document.getElementById('f-'+id);
  const out = document.getElementById('v-'+id);
  input.addEventListener('input', ()=> out.textContent = input.value);
});

const dateInput = document.getElementById('today-date');
dateInput.value = todayStr();
dateInput.addEventListener('change', loadDay);

async function loadDay(){
  const d = await api('GET', '/day/'+dateInput.value);
  document.getElementById('f-weight').value = d.weight ?? '';
  document.getElementById('f-sleep').value = d.sleep_hours ?? '';
  document.getElementById('f-pulse').value = d.morning_pulse ?? '';
  document.getElementById('f-mood').value = d.mood ?? '😐';
  document.getElementById('f-energy').value = d.energy ?? 5;
  document.getElementById('v-energy').textContent = d.energy ?? 5;
  document.getElementById('f-motivation').value = d.motivation ?? 5;
  document.getElementById('v-motivation').textContent = d.motivation ?? 5;
  document.getElementById('f-fatigue').value = d.fatigue ?? 5;
  document.getElementById('v-fatigue').textContent = d.fatigue ?? 5;
  document.getElementById('f-water').value = d.water ?? '';
  document.getElementById('f-calories').value = d.calories ?? '';
  document.getElementById('f-protein').value = d.protein ?? '';
  document.getElementById('f-tasks').value = d.tasks_done ?? '';
  document.getElementById('f-note').value = d.note ?? '';
  renderRoutine(d.routine || []);
}

document.getElementById('save-day').addEventListener('click', async ()=>{
  const payload = {
    weight: numOrNull('f-weight'), sleep_hours: numOrNull('f-sleep'),
    morning_pulse: numOrNull('f-pulse'), mood: document.getElementById('f-mood').value,
    energy: numOrNull('f-energy'), motivation: numOrNull('f-motivation'), fatigue: numOrNull('f-fatigue'),
    water: numOrNull('f-water'), calories: numOrNull('f-calories'), protein: numOrNull('f-protein'),
    tasks_done: numOrNull('f-tasks'), note: document.getElementById('f-note').value,
  };
  await api('PUT', '/day/'+dateInput.value, payload);
  toast('День сохранён');
  refreshScoreboard();
});
function numOrNull(id){ const v = document.getElementById(id).value; return v===''? null : parseFloat(v); }

function renderRoutine(list){
  const el = document.getElementById('routine-list');
  if(!list.length){ el.innerHTML = '<div style="color:var(--muted-2);font-family:JetBrains Mono,monospace;font-size:13px;padding:10px 0;">Шаблон режима пуст — настройте во вкладке «Настройки»</div>'; return; }
  el.innerHTML = list.map(item=>`
    <div class="routine-item">
      <span class="routine-time">${item.time||''}</span>
      <span class="routine-title ${item.checked?'done':''}">${item.title}</span>
      <div class="check ${item.checked?'checked':''}" data-id="${item.id}">${item.checked?'✓':''}</div>
    </div>`).join('');
  el.querySelectorAll('.check').forEach(chk=>{
    chk.addEventListener('click', async ()=>{
      const id = chk.dataset.id;
      const res = await api('POST', '/day/'+dateInput.value+'/routine/'+id+'/toggle');
      chk.classList.toggle('checked', res.checked);
      chk.textContent = res.checked ? '✓' : '';
      chk.previousElementSibling.classList.toggle('done', res.checked);
      refreshScoreboard();
    });
  });
}

// ---------- Settings ----------
async function loadSettings(){
  const s = await api('GET', '/settings');
  document.getElementById('s-target-weight').value = s.target_weight ?? 72;
  document.getElementById('s-season-start').value = s.season_start ?? '';
}
document.getElementById('save-settings').addEventListener('click', async ()=>{
  await api('PUT', '/settings', {
    target_weight: document.getElementById('s-target-weight').value,
    season_start: document.getElementById('s-season-start').value,
  });
  toast('Настройки сохранены');
  refreshScoreboard();
});

let routineDraft = [];
async function loadRoutineEditor(){
  routineDraft = await api('GET', '/routine-template');
  renderRoutineEditor();
}
function renderRoutineEditor(){
  const el = document.getElementById('routine-editor');
  el.innerHTML = routineDraft.map((it,i)=>`
    <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;">
      <input type="time" value="${it.time||''}" style="max-width:110px" data-i="${i}" data-f="time"/>
      <input type="text" value="${it.title||''}" style="flex:1" data-i="${i}" data-f="title"/>
      <button class="check" style="border-radius:8px;color:var(--red);" data-del="${i}">✕</button>
    </div>`).join('');
  el.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const i = +inp.dataset.i, f = inp.dataset.f;
      routineDraft[i][f] = inp.value;
    });
  });
  el.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      routineDraft.splice(+btn.dataset.del, 1);
      renderRoutineEditor();
    });
  });
}
document.getElementById('add-routine-item').addEventListener('click', ()=>{
  routineDraft.push({id:'r'+Date.now(), time:'', title:''});
  renderRoutineEditor();
});
document.getElementById('save-routine').addEventListener('click', async ()=>{
  await api('PUT', '/routine-template', routineDraft);
  toast('Шаблон сохранён');
  loadDay();
});

// ---------- Scoreboard ----------
async function refreshScoreboard(){
  try{
    const streakRes = await api('GET', '/streak');
    document.getElementById('sb-streak').textContent = streakRes.streak ?? '0';
  }catch(e){}

  try{
    const s = await api('GET', '/settings');
    if(s.season_start){
      const diff = Math.ceil((new Date(s.season_start) - new Date(todayStr())) / 86400000);
      document.getElementById('sb-countdown').textContent = diff >= 0 ? diff : 'идёт';
    } else {
      document.getElementById('sb-countdown').textContent = '—';
    }
  }catch(e){}

  try{
    const d = await api('GET', '/day/'+todayStr());
    document.getElementById('sb-weight').textContent = d.weight ?? '–';
    if(d.energy!=null && d.motivation!=null && d.fatigue!=null){
      const readiness = Math.round(((+d.energy + +d.motivation + (11-+d.fatigue)) / 30) * 100);
      document.getElementById('sb-readiness').textContent = readiness + '%';
    } else {
      document.getElementById('sb-readiness').textContent = '–';
    }
  }catch(e){}
}

(async function init(){
  await loadDay();
  await loadSettings();
  await loadRoutineEditor();
  await refreshScoreboard();
})();
</script>
</body>
</html>
